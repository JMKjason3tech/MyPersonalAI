name: MyPersonalAI Milestone 5F

on:
  push:
    branches:
      - milestone-5f-voice-interaction

jobs:
  build-and-package:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      - name: Run tests
        run: ./gradlew test

      - name: Build debug APK
        run: ./gradlew assembleDebug

      - name: Package source ZIP
        run: |
          zip -r MyPersonalAI-Milestone5F-Rebuild-v1.zip . \
            -x '.git/*' 'app/build/*' '**/.gradle/*'

      - name: Upload 5F source ZIP
        uses: actions/upload-artifact@v4
        with:
          name: MyPersonalAI-Milestone5F-Rebuild-v1
          path: MyPersonalAI-Milestone5F-Rebuild-v1.zip

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: MyPersonalAI-Milestone5F-Debug-v1
          path: app/build/outputs/apk/debug/app-debug.apk
